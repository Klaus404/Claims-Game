spring.application.name=ClaimsBackend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/claims}
spring.datasource.username=${DATABASE_USERNAME:claims}
spring.datasource.password=${DATABASE_PASSWORD:claims}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
